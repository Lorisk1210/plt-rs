# Lets the musl target link without a system C toolchain.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

[alias]
xtask = "run --package xtask --release --"

# What cargo runs here (tests, doctests, examples, xtask) sees no plt-rs
# configuration from the home directory (`~/.config/plt-rs`): unless the
# shell sets it, PLTCONFIGDIR names an empty directory under target/.
[env]
PLTCONFIGDIR = { value = "target/plt-config", relative = true }
