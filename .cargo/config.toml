# Lets the musl target link without a system C toolchain.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes"]

[alias]
xtask = "run --package xtask --release --"

# What cargo runs here (tests, doctests, examples, xtask) sees no pltrs
# configuration from the home directory (`~/.config/pltrs`): unless the
# shell sets it, PLTRSCONFIGDIR names an empty directory under target/.
[env]
PLTRSCONFIGDIR = { value = "target/pltrs-config", relative = true }
