# pltrs (Python)'s wheels and sdist: built for Linux (x86_64 and aarch64,
# manylinux2014 and musllinux_1_2, inside the official containers), macOS
# (universal2) and Windows (win_amd64; win_arm64 when asked), each installed
# in a fresh venv on a runner of its platform and smoke-tested there
# (python/tools/check_dist.py --install), then, for a version tag,
# published to PyPI through trusted publishing. RELEASING.md says how.
#
# It runs only when started by hand (Actions > wheels > Run workflow) or by
# pushing a tag v<version>: the repository is private, so every run costs
# Actions minutes (macOS ten times, Windows twice). It never runs for
# pushes of branches or for pull requests.

name: wheels

on:
  workflow_dispatch:
    inputs:
      win_arm64:
        description: "Also build win_arm64 and test it on an arm64 Windows runner"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_tests: ${{ steps.plan.outputs.windows_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag, choose the runners
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          WIN_ARM64: ${{ inputs.win_arm64 || vars.WIN_ARM64 }}
          LINUX_ARM64_RUNNER: ${{ vars.LINUX_ARM64_RUNNER }}
          WINDOWS_ARM64_RUNNER: ${{ vars.WINDOWS_ARM64_RUNNER }}
        run: python3 .github/scripts/plan.py

  sdist:
    name: sdist and the matplotlib alias
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the sdist and the alias wheel
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist .
          python -m build --wheel --config-setting distribution=matplotlib --outdir alias .
          python python/tools/check_dist.py dist/* alias/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pltrs-sdist
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alias
          path: alias/*
          if-no-files-found: error

  sdist-test:
    name: sdist built and tested
    needs: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pltrs-sdist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alias
          path: dist
      - name: Install the sdist (pip builds it with cargo) and check it
        run: python python/tools/check_dist.py --install --work "$RUNNER_TEMP/check" dist/*

  linux:
    name: Linux ${{ matrix.platform }} ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    env:
      IMAGE: quay.io/pypa/${{ matrix.platform }}_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The container's own C library and compilers build the wheel. They
      # are too old for the actions' JavaScript, so docker runs them.
      - name: Build the wheel in the container
        run: docker run --rm -v "$PWD:/io" -w /io -e CARGO_TERM_COLOR "$IMAGE" sh .github/scripts/container.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pltrs-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  linux-test:
    name: Linux ${{ matrix.platform }} ${{ matrix.arch }} tested
    needs: [plan, linux, sdist]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    env:
      IMAGE: quay.io/pypa/${{ matrix.platform }}_${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pltrs-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alias
          path: dist
      # On the oldest C library the tag allows: glibc 2.17, or musl 1.2.
      - name: Install and check in the container
        run: docker run --rm -v "$PWD:/io" -w /io "$IMAGE" sh .github/scripts/container.sh test dist/*.whl
      # On the runner's own system, with the oldest and the newest Python.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.platform == 'manylinux2014'
        id: oldest
        with:
          python-version: "3.12"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.platform == 'manylinux2014'
        id: newest
        with:
          python-version: "3.14"
      - name: Install and check with Python 3.14
        if: matrix.platform == 'manylinux2014'
        run: python python/tools/check_dist.py --install --python "${{ steps.newest.outputs.python-path }}" --work "$RUNNER_TEMP/check" dist/*.whl
      - name: Install and check the lowest requirements with Python 3.12
        if: matrix.platform == 'manylinux2014'
        run: python python/tools/check_dist.py --install --lowest --python "${{ steps.oldest.outputs.python-path }}" --work "$RUNNER_TEMP/check" dist/pltrs-*.whl

  macos:
    name: macOS universal2
    needs: [plan, sdist]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: oldest
        with:
          python-version: "3.12"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: intel
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: newest
        with:
          python-version: "3.14"
      - name: Build the universal2 wheel
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          python -m pip wheel --no-deps --wheel-dir dist --config-settings target=universal2 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pltrs-macos-universal2
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alias
          path: alias
      # Both halves of the wheel: arm64 natively, x86_64 under Rosetta. The
      # job builds and tests at once, as macOS minutes cost ten times.
      - name: Install and check, arm64, Python 3.12 and 3.14
        run: |
          for python in "${{ steps.oldest.outputs.python-path }}" "${{ steps.newest.outputs.python-path }}"; do
            python python/tools/check_dist.py --install --python "$python" --work "$RUNNER_TEMP/check" dist/*.whl alias/*.whl
          done
      - name: Install and check, x86_64 under Rosetta, Python 3.12
        run: |
          python="${{ steps.intel.outputs.python-path }}"
          "$python" -c "import platform; assert platform.machine() == 'x86_64', platform.machine()"
          "$python" python/tools/check_dist.py --install --python "$python" --work "$RUNNER_TEMP/check-x86_64" dist/*.whl alias/*.whl

  windows:
    name: Windows ${{ matrix.arch }}
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.windows) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel with MSVC
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.arch }}-pc-windows-msvc
          python -m pip wheel --no-deps --wheel-dir dist --config-settings target=${{ matrix.arch }}-pc-windows-msvc .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pltrs-windows-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  windows-test:
    name: Windows ${{ matrix.arch }} tested, Python ${{ matrix.python }}
    needs: [plan, windows, sdist]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows_tests) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pltrs-windows-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alias
          path: dist
      - name: Install and check
        run: python python/tools/check_dist.py --install --work "$RUNNER_TEMP/check" dist/*.whl

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [sdist-test, linux-test, macos, windows-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Protected in the repository's settings (RELEASING.md): PyPI trusts
    # this workflow in this environment only.
    environment:
      name: pypi
      url: https://pypi.org/project/pltrs/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pltrs' archives only: the matplotlib alias cannot go to PyPI, where
      # the name is matplotlib's.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pltrs-*
          merge-multiple: true
          path: dist
      - name: Check every archive once more
        run: |
          ls -l dist
          python3 python/tools/check_dist.py dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    name: Draft the GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: A draft release with every archive, the alias included
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "pltrs ${TAG#v}" --notes "pltrs ${TAG#v}, on PyPI as pltrs==${TAG#v}." dist/*
