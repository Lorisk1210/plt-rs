[workspace]
resolver = "3"
members = ["crates/*", "examples/rust", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lorisk1210/plt-rs"

# The crates are released together, at the version above, and each needs
# the others at exactly that version (`=`): what they offer each other is
# no interface of its own, and a newer one may change it in any release.
# A new version changes these requirements with the one above.
[workspace.dependencies]
pltrs-core = { path = "crates/pltrs-core", version = "=0.1.0" }
pltrs-codec = { path = "crates/pltrs-codec", version = "=0.1.0" }
pltrs-font = { path = "crates/pltrs-font", version = "=0.1.0" }
pltrs-raster = { path = "crates/pltrs-raster", version = "=0.1.0" }
pltrs-text = { path = "crates/pltrs-text", version = "=0.1.0" }
pltrs-render = { path = "crates/pltrs-render", version = "=0.1.0" }
pltrs-platform = { path = "crates/pltrs-platform", version = "=0.1.0" }
pltrs-ui = { path = "crates/pltrs-ui", version = "=0.1.0" }
pltrs = { path = "crates/pltrs", version = "=0.1.0" }
pltrs-spec = { path = "crates/pltrs-spec" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Numeric code converts between float and integer pixel domains constantly;
# each such cast is deliberate.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Math-heavy code legitimately uses short, similar names (x0, x1, dx, dy).
many_single_char_names = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Restriction lints that keep library code honest.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"

[profile.dev]
# Rendering tests are pixel-heavy; unoptimised builds are needlessly slow.
opt-level = 1

[profile.release]
debug = "line-tables-only"

# The rasterizer and the path geometry it draws: in one codegen unit each,
# their hot paths inline into each other (drawing 10^5 scatter markers
# takes about 4% less time).
[profile.release.package.pltrs-raster]
codegen-units = 1

[profile.release.package.pltrs-core]
codegen-units = 1

# The figure model in one codegen unit too: how cargo splits it into
# sixteen decides whether the image resamplers' per-pixel calls inline,
# and an unrelated change elsewhere in the crate moved that split enough
# to slow imshow_2000_bicubic_colorbar by 11%. In one unit both images
# run at their best whatever else changes.
[profile.release.package.pltrs]
codegen-units = 1

# The extension of pltrs (Python) (`cargo xtask python --release`, the
# wheel): built as one unit with fat LTO, the code that runs together lies
# together, so that a process maps about 5 MiB less of it, and calls
# between the crates inline (markers draw about 8% faster).
[profile.extension]
inherits = "release"
lto = "fat"
codegen-units = 1
