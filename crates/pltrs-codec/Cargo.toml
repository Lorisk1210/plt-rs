[package]
name = "pltrs-codec"
description = "Self-contained compression and image codecs: DEFLATE/zlib, PNG/APNG, JPEG, TIFF, GIF and WebP, and an AVIF encoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["png", "deflate", "jpeg", "webp", "avif"]
categories = ["compression", "encoding", "multimedia::images"]

[dependencies]
pltrs-core.workspace = true

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
