[package]
name = "pltrs-core"
description = "Geometry, paths, affine transforms, colours and numpy's float semantics shared by every pltrs crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["geometry", "affine", "bezier", "path", "matplotlib"]
categories = ["graphics", "mathematics"]
build = "build/main.rs"

[features]
# The harness of the workspace's robustness tests (`fuzz`), which the
# crates above turn on for their tests alone.
fuzzing = []

[dependencies]

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
