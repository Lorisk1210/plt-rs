[package]
name = "pltrs-font"
description = "TrueType/OpenType parsing, glyph outlines, shaping and font management with bundled fonts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["truetype", "opentype", "font", "shaping", "hinting"]
categories = ["text-processing", "graphics"]

[dependencies]
pltrs-core.workspace = true

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
