[package]
name = "pltrs-platform"
description = "Native windowing and input abstraction (Wayland, X11, macOS and Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["windowing", "wayland", "x11", "win32", "appkit"]
categories = ["gui", "os"]

[dependencies]

[dev-dependencies]
# The window example saves screenshots as PNG.
pltrs-codec.workspace = true
# The fuzz tests' harness.
pltrs-core = { workspace = true, features = ["fuzzing"] }

# AppKit runs on the main thread only, which libtest keeps for itself: the
# macOS live tests bring their own runner.
[[test]]
name = "macos"
harness = false

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
