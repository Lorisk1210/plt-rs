[package]
name = "pltrs-platform"
description = "Native windowing and input abstraction (Wayland, X11, macOS and Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
# The window example saves screenshots as PNG.
pltrs-codec.workspace = true
# The fuzz tests share pltrs's fuzz harness, which draws from its generator.
pltrs-core.workspace = true

# AppKit runs on the main thread only, which libtest keeps for itself: the
# macOS live tests bring their own runner.
[[test]]
name = "macos"
harness = false

[lints]
workspace = true
