[package]
name = "pltrs-python"
description = "pltrs (Python): pltrs with matplotlib's syntax, a hand-written CPython extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Never published to crates.io, whatever the workspace says.
publish = false
license.workspace = true
repository.workspace = true

[lib]
# The Python extension: `cargo xtask python` installs the library as
# `python/pltrs/_native.abi3.so`.
crate-type = ["cdylib"]

[dependencies]
pltrs.workspace = true
pltrs-core.workspace = true
pltrs-platform.workspace = true
pltrs-text.workspace = true
pltrs-font.workspace = true
pltrs-render.workspace = true

[lints]
workspace = true
