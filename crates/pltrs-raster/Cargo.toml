[package]
name = "pltrs-raster"
description = "Anti-aliased scanline rasterizer, stroker and compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rasterizer", "antialiasing", "agg", "stroke", "graphics"]
categories = ["graphics", "rendering"]

[dependencies]
pltrs-core.workspace = true

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
