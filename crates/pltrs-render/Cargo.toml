[package]
name = "pltrs-render"
description = "Renderer abstraction with raster (PNG), SVG, PDF, PostScript and PGF backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["svg", "pdf", "postscript", "pgf", "renderer"]
categories = ["graphics", "rendering"]

[dependencies]
pltrs-codec.workspace = true
pltrs-core.workspace = true
pltrs-font.workspace = true
pltrs-raster.workspace = true
pltrs-text.workspace = true

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
