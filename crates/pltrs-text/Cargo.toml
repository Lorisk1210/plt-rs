[package]
name = "pltrs-text"
description = "Text layout, mathtext and usetex (DVI, virtual fonts, TFM, font maps) with the results of matplotlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mathtext", "tex", "dvi", "typesetting", "matplotlib"]
categories = ["text-processing", "graphics"]

[dependencies]
pltrs-codec.workspace = true
pltrs-core.workspace = true
pltrs-font.workspace = true

[dev-dependencies]
# The fuzz tests' harness.
pltrs-core = { workspace = true, features = ["fuzzing"] }

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
