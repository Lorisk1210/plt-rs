[package]
name = "pltrs-ui"
description = "A small retained-mode UI engine used for pltrs figure windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ui", "widgets", "gui", "retained-mode", "matplotlib"]
categories = ["gui"]

[dependencies]
pltrs-core.workspace = true
pltrs-raster.workspace = true
pltrs-text.workspace = true
pltrs-platform.workspace = true

[dev-dependencies]
# The canvas window example saves screenshots as PNG.
pltrs-codec.workspace = true
# The fuzz tests' harness.
pltrs-core = { workspace = true, features = ["fuzzing"] }

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
