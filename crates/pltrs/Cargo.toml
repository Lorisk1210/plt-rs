[package]
name = "pltrs"
description = "matplotlib rebuilt in Rust: figures, axes, artists, every output format, interactive windows and a pyplot-style API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["matplotlib", "plotting", "chart", "visualization", "pyplot"]
categories = ["visualization", "science", "graphics"]

[dependencies]
pltrs-codec.workspace = true
pltrs-core.workspace = true
pltrs-platform.workspace = true
pltrs-raster.workspace = true
pltrs-render.workspace = true
pltrs-text.workspace = true
pltrs-ui.workspace = true

[dev-dependencies]
# The fuzz tests feed corrupted fonts to the font parser directly.
pltrs-font.workspace = true
# The fuzz tests' harness.
pltrs-core = { workspace = true, features = ["fuzzing"] }

# docs.rs documents the systems pltrs supports (the first is the default).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[lints]
workspace = true
