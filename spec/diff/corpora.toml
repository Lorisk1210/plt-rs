# The corpora of `cargo xtask diff --corpus`: programs that users of
# matplotlib wrote, run under matplotlib and under pltrs (Python) and
# compared as the gallery is (`spec/diff/corpora.py` reads this file).
#
# Each table is one corpus, fetched from its repository at `commit` into
# `target/diff/corpora/<name>/tree` (a sparse checkout of the `fetch`
# patterns, git's `--no-cone` syntax) and checked against `sha256`, the
# SHA-256 of the `sha256sum` lines of every regular file fetched (symbolic
# links are not hashed), sorted by path (`find . -type f -not -path
# './.git' | sort | xargs sha256sum | sha256sum`, in the tree, under the C
# locale). Only corpora whose licence allows
# running and fixing against them are listed, and no program naming a URL
# but those of its repository's files. Corpora are permissively licensed
# code; a data-only entry (`kind = "data"`) is input fetched at test time,
# as the programs reading it would download it, and may lack a licence
# statement: nothing of it runs, is copied as a corpus or is redistributed.
#
# A corpus of the repository's own has a `path` (its directory, relative to
# the repository's root, which is its tree) instead of `repository`,
# `commit`, `fetch` and `sha256`: nothing is fetched, and its programs'
# reference runs depend on their text alone.
#
# * `programs`: the programs, globs in the tree. A `.py` file runs whole, as
#   a gallery example does; a notebook (`.ipynb`, nbformat 3 or 4) or a
#   Markdown page with ```python blocks or a MyST page's ```{code-cell}
#   blocks (`.md`) or a reStructuredText page's IPython directives
#   (`.. ipython:: python`, `.rst`) runs cell by cell, an exception stopping its
#   cell only, and every figure a cell leaves open is compared and closed
#   at its end, as Jupyter's inline backend shows and closes them.
#   A cell awaiting at its top level (JupyterLite's `await piplite.install`)
#   runs as a coroutine, as IPython's kernels run it. A reStructuredText
#   page's plot directives with their code inline run too (matplotlib's
#   Sphinx extension runs them at every build; one naming a file shows a
#   gallery example, which the gallery measures), and a page or notebook
#   with no code is no program.
# * `doctests`: whether the doctest blocks of the corpus' reStructuredText
#   pages run too (Sphinx's doctest builder runs them), each a cell.
# * `docstrings`: globs of modules whose docstrings' `Examples` sections
#   (their doctest blocks, plot directives and literal blocks) run, each a
#   cell, as a program `docstrings/<module path>`.
# * `shell = "ipython"`: the corpus' cells run in an IPython shell, as
#   Jupyter runs them: `get_ipython()`, the magics a cell runs (IPython's
#   input transformer makes them Python) and those a module registers.
#   The magics choosing matplotlib's backend (`%matplotlib inline`,
#   `%pylab`) do not run: the tester shows and closes the figures each
#   cell leaves open as the inline backend does already, so the shell
#   changes neither which figures there are nor their size, and both
#   implementations run in the same shell. Without the key, magics are
#   left out and there is no `get_ipython()`.
# * `exclude`: globs of programs left out, each with its reason.
# * `outputs`: directories the programs write their figures into; each run
#   gets them empty (the rest of the tree reaches it read-only).
# * `data-urls`: prefixes of URLs at which programs read files of the
#   repository itself (with pandas' `read_csv`, say), read from the fetched
#   tree instead: the URLs become the files' paths.
# * `file-urls`: the same, for programs that download the files (with
#   urllib's `urlretrieve`): the URLs become `file:` URLs of the files.
#   A URL a program spells as a sum of string literals (`'https://host/' +
#   'file'`) is joined into one literal first, for both lists.
# * `prelude`: code a program run cell by cell runs first, as a cell of its
#   own: what a documentation build runs before each page (pandas' header).
# * `environment`: variables the programs run with, `{corpus:NAME}` standing
#   for the fetched tree of corpus NAME (seaborn's `SEABORN_DATA`, where
#   `load_dataset` finds the datasets it would download); a `PYTHONPATH`
#   comes before the harness' own.
#
# The programs run offline: what they would download fails under both.
#
# Every program runs in its own directory, in a copy of the tree made of
# links, so that the paths it reads and writes relative to it work as in
# its repository.

[rougier-book]
title = "Nicolas P. Rougier, Scientific Visualization: Python + Matplotlib (2021), the book's code"
